name: Vera
description: 'Vera was a data-centric security company delivering information rights
  management (IRM) as a service, letting businesses encrypt, track, audit, and revoke
  access to files anywhere they travel, with an SDK and REST API for embedding AES
  256-bit encryption and policy enforcement into applications. Backed by Amplify
  Partners, Battery Ventures, and Sutter Hill Ventures, Vera was acquired by HelpSystems
  (now Fortra) in December 2020 and lives on as Fortra''s Digital Guardian Secure
  Collaboration product; its developer surface (SDK/REST API) is now available to
  Fortra customers rather than as a public developer program.'
